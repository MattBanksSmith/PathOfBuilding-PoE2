<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PoB Trade Evaluator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 280px;
            padding: 14px 16px;
            background: #111;
            color: #ccc;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }
        h1 {
            font-size: 14px;
            color: #af6025;
            margin-bottom: 12px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 8px;
        }
        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot.ok      { background: #5c5; }
        .dot.warn    { background: #cc5; }
        .dot.error   { background: #c55; }
        .label { color: #999; margin-right: 4px; }
        .value { color: #ddd; }
        .build-name { color: #af6025; font-style: italic; }
        .hint {
            margin-top: 12px;
            padding: 8px;
            background: #1a1a1a;
            border-radius: 4px;
            color: #777;
            font-size: 11px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>PoB Trade Evaluator</h1>

    <div class="status-row">
        <div class="dot" id="dot-pob"></div>
        <span><span class="label">PoB:</span><span id="pob-status" class="value">checking…</span></span>
    </div>

    <div class="status-row" id="build-row" style="display:none">
        <div class="dot ok"></div>
        <span><span class="label">Build:</span><span id="build-name" class="build-name"></span></span>
    </div>

    <div class="hint">
        Open PoB with a build loaded, then click <strong style="color:#af6025">PoB</strong>
        next to any item on the trade site to see the stat delta.
    </div>

    <script src="popup.js"></script>
</body>
</html>
